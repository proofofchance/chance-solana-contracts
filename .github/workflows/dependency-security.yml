name: Contract dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - programs/registry/Cargo.lock
          - programs/daily-lottery-v1/Cargo.lock
          - programs/giveaways-v1/Cargo.lock
          - tools/idl-export/Cargo.lock
          - tests/runtime/Cargo.lock
          - tools/sbf-builder/Cargo.lock
          - tools/dependency-audit/Cargo.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - run: python3 -B -m unittest discover -s tools/dependency-audit -p test_install.py -v
      - name: Install and self-audit the reviewed scanner
        run: |
          python3 -B tools/dependency-audit/install.py --work-dir "$RUNNER_TEMP/chance-cargo-audit-build" --install-root "$RUNNER_TEMP/chance-cargo-audit-installed"
          echo "$RUNNER_TEMP/chance-cargo-audit-installed/bin" >> "$GITHUB_PATH"
      - run: python3 -B -m unittest discover -s tools -p test_runtime_advisory_gate.py -v
      - name: Audit production and tool locks strictly
        if: matrix.lockfile != 'tests/runtime/Cargo.lock'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chance-advisory-report"
          "$RUNNER_TEMP/chance-cargo-audit-installed/bin/cargo-audit" audit --file '${{ matrix.lockfile }}' --json | tee "$RUNNER_TEMP/chance-advisory-report/report.json"
      - name: Audit the exact approved isolated runtime context
        if: matrix.lockfile == 'tests/runtime/Cargo.lock'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chance-advisory-report"
          set +e
          "$RUNNER_TEMP/chance-cargo-audit-installed/bin/cargo-audit" audit --file tests/runtime/Cargo.lock --json > "$RUNNER_TEMP/chance-advisory-report/report.json" 2> "$RUNNER_TEMP/chance-advisory-report/scanner-stderr.txt"
          raw_status=$?
          set -e
          printf '%s\n' "$raw_status" > "$RUNNER_TEMP/chance-advisory-report/scanner-exit.txt"
          cat "$RUNNER_TEMP/chance-advisory-report/report.json"
          cat "$RUNNER_TEMP/chance-advisory-report/scanner-stderr.txt" >&2
          python3 -B tools/runtime_advisory_gate.py --lockfile tests/runtime/Cargo.lock --report "$RUNNER_TEMP/chance-advisory-report/report.json" --raw-status "$raw_status"
      - name: Retain complete raw advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solana-advisory-${{ strategy.job-index }}
          path: ${{ runner.temp }}/chance-advisory-report/
          if-no-files-found: warn
