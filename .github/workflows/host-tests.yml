name: Solana host tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        program: [daily-lottery-v1, giveaways-v1, registry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev
      - run: cargo test --locked --lib --manifest-path programs/${{ matrix.program }}/Cargo.toml
      - if: matrix.program == 'giveaways-v1'
        run: cargo test --locked --lib --manifest-path programs/giveaways-v1/Cargo.toml --features brand-review

  consumer-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev
      - run: python3 tools/export_schemas.py
      - run: cargo run --locked --manifest-path tools/idl-export/Cargo.toml
      - run: cargo run --locked --manifest-path tools/idl-export/Cargo.toml -- --brand-review-v1
      - run: git diff --exit-code -- audit/schemas/
      - run: python3 -m unittest discover -s audit/tests -v
      - run: python3 -m unittest discover -s tools -p 'test_brand_review.py' -v
