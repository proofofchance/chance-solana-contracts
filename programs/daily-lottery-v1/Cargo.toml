[package]
autotests = false
name = "daily_lottery"
version = "0.1.0"
edition = "2021"
description = "Daily Lottery program (pure Solana program without Anchor)"

[lib]
crate-type = ["cdylib", "lib"]
name = "daily_lottery"

[features]
staging-afresh-v1 = []
allow-early-upload = []
local-test-controls = []
staging-test-controls = []
production-release = []
allow-service-charge-update = []
no-entrypoint = []
default = []

[dependencies]
solana-program = "=5.2.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-sha256-hasher = "=3.1.0"
borsh = { version = "=1.8.1", features = ["derive"] }
thiserror = "=2.0.21"
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chance-registry-wire = { path = "../../crates/registry-wire" }



[workspace]
members = ["."]
resolver = "2"

[profile.dev]
# Keep project-level symbols while shrinking workspace debug artifacts.
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.release]
overflow-checks = true
