[package]
name = "giveaways"
version = "0.1.0"
description = "ProofOfChance Giveaways Program - Transparent brand giveaways with proof-of-chance winner selection"
edition = "2021"
license = "MIT"
repository = "https://github.com/proofofchance/proofofchance"

[lib]
crate-type = ["cdylib", "lib"]
name = "giveaways"

[features]
brand-review = []
staging-afresh-v1 = ["brand-review"]
devnet-v1 = []
allow-early-upload = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }
anchor-lang = { version = "=1.2.2", default-features = false, features = ["init-if-needed", "solana-v4"] }
solana-program = "=5.2.0"
sha2 = "=0.11.1"
bytemuck = "=1.25.2"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chance-registry-wire = { path = "../../crates/registry-wire" }

[workspace]
members = ["."]
resolver = "2"

[profile.dev]
# Keep project-level symbols while shrinking workspace debug artifacts.
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.release]
overflow-checks = true
