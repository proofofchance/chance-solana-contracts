[package]
name = "chance-contract-runtime-tests"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[lib]
path = "lib.rs"

[workspace]
members = [".", "daily-model"]
default-members = ["."]
resolver = "2"

[features]
daily-suite = []
registry-suite = []
staging-afresh-v1 = ["daily_lottery/staging-afresh-v1"]
allow-early-upload = ["daily_lottery/allow-early-upload"]
local-test-controls = ["daily_lottery/local-test-controls"]
staging-test-controls = ["daily_lottery/staging-test-controls"]
production-release = ["daily_lottery/production-release"]
allow-service-charge-update = ["daily_lottery/allow-service-charge-update"]
no-entrypoint = ["daily_lottery/no-entrypoint"]
default = ["daily-suite", "registry-suite"]

[dev-dependencies]
daily_lottery = { package = "chance-daily-runtime-model", path = "daily-model", features = ["no-entrypoint"] }
chance-registry-wire = { path = "../../crates/registry-wire" }
litesvm = { version = "=0.18.2", features = ["precompiles"] }
borsh = { version = "=1.8.1", features = ["derive"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
solana-program = "=4.0.0"
solana-pubkey = "=4.3.0"
solana-account = "4.3.0"
solana-clock = "~3.2.0"
solana-ed25519-program = "=3.0.0"
solana-instruction = "~3.5.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["wincode"] }
solana-transaction-error = "~3.4.0"
solana-sha256-hasher = "=3.1.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }

[profile.dev]
debug = 0
incremental = false

[[test]]
name = "admin_and_errors"
path = "../../programs/daily-lottery-v1/tests/admin_and_errors.rs"
required-features = ["daily-suite"]

[[test]]
name = "flow"
path = "../../programs/daily-lottery-v1/tests/flow.rs"
required-features = ["daily-suite"]

[[test]]
name = "full_flow"
path = "../../programs/daily-lottery-v1/tests/full_flow.rs"
required-features = ["daily-suite"]

[[test]]
name = "initialize"
path = "../../programs/daily-lottery-v1/tests/initialize.rs"
required-features = ["daily-suite"]

[[test]]
name = "settlement"
path = "../../programs/daily-lottery-v1/tests/settlement.rs"
required-features = ["daily-suite"]

[[test]]
name = "test_controls"
path = "../../programs/daily-lottery-v1/tests/test_controls.rs"
required-features = ["daily-suite"]

[[test]]
name = "giveaway_brand_review"
path = "../../programs/registry/tests/giveaway_brand_review.rs"
required-features = ["registry-suite"]

[[test]]
name = "giveaway_devnet"
path = "../../programs/registry/tests/giveaway_devnet.rs"
required-features = ["registry-suite"]

[[test]]
name = "lifecycle"
path = "../../programs/registry/tests/lifecycle.rs"
required-features = ["registry-suite"]

[[test]]
name = "staging_afresh"
path = "../../programs/registry/tests/staging_afresh.rs"
required-features = ["registry-suite"]
